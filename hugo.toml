baseURL = 'https://hung-nguyen-quoc11278.github.io/hungdaily-blog/'
languageCode = 'vi'
title = 'Hung Daily Blog'
theme = 'blowfish'

[params]
  homepageStyle = "card" # Hoặc "hero"
  displayFullLogo = false
  
  # Hiển thị các bài viết gần đây ngay trang chủ
  showRecent = true
  recentLimit = 5
  enableSearch = true

  # --- BỔ SUNG CÁC THAM SỐ NÀY ĐỂ HIỆN BÀI VIẾT NGOÀI TRANG CHỦ ---
  showRecentArticles = true
  articleView = "card" # Kiểu hiển thị danh sách bài viết: "card", "row", hoặc "compact"
  showTaxonomies = true # Hiển thị tags và categories trên trang chủ nếu muốn

[author]
  name = "Hung Nguyen"
  image = "img/author.jpg" 
  headline = "Lười thâm niên"
  bio = "Lười, cụ thể là boss lười"

[[params.social]]
  name = "GitHub"
  icon = "github"
  url = "https://github.com/Hung-Nguyen-Quoc11278"

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[outputs]
  home = ["HTML", "JSON", "RSS"]