baseURL = 'https://hung-nguyen-quoc11278.github.io/hungdaily-blog/'
languageCode = 'vi'
title = 'Hung Daily Blog'
theme = 'blowfish'

[params]
  enableSearch = true
  articleView = "card"
  showTaxonomies = true

  # Cấu hình hiển thị trang chủ
  [params.homepage]
    layout = "profile"        # "profile" hoặc "hero" để hiển thị thông tin tác giả
    homepageStyle = "card"     # Kiểu hiển thị danh sách bài viết bên dưới
    showRecent = true
    recentLimit = 5

  # Cấu hình Tác giả chuẩn Blowfish (Bắt buộc phải nằm dưới params)
  [params.author]
    name = "Hung Nguyen"
    image = "img/author.jpg"   # File đặt trong folder `assets/img/author.jpg` hoặc `static/img/author.jpg`
    headline = "Lì kinh khủng"
    bio = "Lì, siêu lì lợm"
    links = [
      { facebook = "https://www.facebook.com/nguyen.quoc.hung.131770?locale=vi_VN" },
      { whatsapp = "https://wa.me/84373434798" },
      { github = "https://github.com/Hung-Nguyen-Quoc11278" },
      { email = "mailto:hunggoodboy34@gmail.com" }
    ]

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[outputs]
  home = ["HTML", "JSON", "RSS"]

[[menu.main]]
  name = "Bài viết"
  pageRef = "/posts"
  weight = 1

[[menu.main]]
  name = "Chủ đề"
  pageRef = "/categories"
  weight = 2

[[menu.main]]
  name = "Thẻ"
  pageRef = "/tags"
  weight = 3